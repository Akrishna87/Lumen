name: Lumen APK

on:
  push:
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: English model for text recognition (Tesseract tessdata_fast, Apache 2.0)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -sSfL --retry 3 -o app/src/main/assets/tessdata/eng.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata
          echo "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  app/src/main/assets/tessdata/eng.traineddata" | sha256sum -c -
      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            echo "=== Errors ==="
            grep -E '^e: |error:|FAILED|What went wrong' -A2 build.log | sed 's|file:///home/runner/work/lumen/lumen/app/src/main/java/io/github/akrishna87/lumen/||' | tail -120
          fi
          exit $status
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Lumen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-apk
          path: Lumen.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lumen-apk
          path: apk
      - name: Make test photos and a video
        run: |
          python3 -m pip install --quiet pillow
          python3 ci/make_media.py media
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -loglevel error -f lavfi -i "testsrc=size=1280x720:rate=30:duration=12" \
            -f lavfi -i "sine=frequency=440:duration=12" \
            -c:v libx264 -pix_fmt yuv420p -preset veryfast -c:a aac -shortest "media/camera/Smoke Clip.mp4"
          ls -laR media
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash ci/smoke-test.sh apk/Lumen.apk media smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumen-smoke-test-screens
          path: smoke-out

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lumen-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: lumen-smoke-test-screens
          path: out/screens
      - name: Publish the APK as the "lumen-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find out/screens -name '*.png' -size 0 -delete # a blank screenshot can't be uploaded
          title="Lumen gallery for Android (build ${{ github.run_number }})"
          notes="Download **Lumen.apk** on your Android phone, open it, and allow installing from your browser when asked. Each new build installs as an update over the last one. The PNG files are screenshots from the automatic emulator test of this build."
          # Update the release in place (never delete it), so the download link keeps working even
          # if a step fails part-way.
          if gh release view lumen-latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/lumen-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload lumen-latest out/Lumen.apk out/screens/*.png --clobber
            gh release edit lumen-latest --title "$title" --notes "$notes"
          else
            gh release create lumen-latest out/Lumen.apk out/screens/*.png --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
          fi
